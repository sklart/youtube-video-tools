name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  quality:
    name: Quality / Python 3.14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall youtube_video_tools
      - run: video-tools --version
      - run: python video_tools.py --version
      - run: python -c "import youtube_video_tools, youtube_video_tools.cli; assert youtube_video_tools.__version__ == '1.0.0'"
