# Copy this file to config.toml and set local paths if necessary.

[paths]
# cookies = "C:\\path\\to\\youtube-cookies.txt"
yt_dlp = "yt-dlp"
ffprobe = "ffprobe"
ffmpeg = "ffmpeg"

[subtitles]
folders = []
languages = ["ru", "en"]
pause_seconds = 5

[sorting]
pause_seconds = 2
max_retries = 3
allow_unknown = false

[download]
sync_archive_before_download = true

[bookmarks]
pause_seconds = 3
max_retries = 2
retry_backoff_seconds = 30
